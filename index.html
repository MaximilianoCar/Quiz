<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Evaluación de programación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&family=Roboto+Mono:wght@400;500&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --blue: #1a73e8; --blue-dark: #1557b0; --text: #202124; --muted: #5f6368; --surface: #fff; --background: #f1f3f4; --border: #dadce0; --danger: #b3261e; --success: #137333; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; color: var(--text); background: var(--background); font: 16px/1.5 Roboto, sans-serif; }
    .site-header { border-top: 8px solid var(--blue); background: var(--surface); padding: 24px 16px; box-shadow: 0 1px 3px #00000018; }
    .header-content, main { width: min(100% - 32px, 760px); margin: 0 auto; }
    h1, h2 { font-family: "Google Sans", sans-serif; font-weight: 500; line-height: 1.2; }
    h1 { margin: 0; font-size: clamp(1.5rem, 6vw, 2rem); }
    h2 { margin: 0 0 8px; font-size: 1.35rem; }
    main { padding: 24px 0 56px; }
    .screen { display: none; animation: appear .25s ease-out; }
    .screen.active { display: block; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 2px 5px #00000012; padding: 24px; }
    .intro-card { border-top: 8px solid var(--blue); }
    .muted, .hint { color: var(--muted); }
    .hint { margin-top: 0; }
    label { display: block; margin: 20px 0 7px; font-weight: 500; }
    input { width: 100%; border: 1px solid #80868b; border-radius: 4px; padding: 12px; color: var(--text); font: inherit; }
    input:focus { outline: 2px solid #8ab4f8; border-color: var(--blue); }
    .error { min-height: 24px; color: var(--danger); margin: 8px 0 0; }
    button { border: 0; border-radius: 4px; padding: 11px 20px; background: var(--blue); color: #fff; cursor: pointer; font: 500 14px "Google Sans", sans-serif; }
    button:hover { background: var(--blue-dark); }
    button:focus-visible { outline: 3px solid #8ab4f8; outline-offset: 2px; }
    button:disabled { opacity: .55; cursor: wait; }
    .form-actions { display: flex; justify-content: flex-end; margin-top: 24px; }
    .exam-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 16px; }
    .progress { color: var(--muted); font-size: .9rem; }
    .timer { min-width: 92px; border-radius: 20px; background: #e8f0fe; color: var(--blue-dark); padding: 7px 13px; text-align: center; font-weight: 700; }
    .timer.warning { background: #fce8e6; color: var(--danger); }
    pre { overflow-x: auto; margin: 20px 0; padding: 16px; border-radius: 6px; background: #202124; color: #e8eaed; font: .9rem/1.55 "Roboto Mono", monospace; white-space: pre-wrap; }
    .options { display: grid; gap: 10px; margin-top: 22px; }
    .option { display: flex; align-items: flex-start; gap: 10px; border: 1px solid var(--border); border-radius: 6px; padding: 13px; cursor: pointer; }
    .option:hover { background: #f8fafd; border-color: #8ab4f8; }
    .option input { width: auto; margin-top: 4px; accent-color: var(--blue); }
    .exam-actions { display: flex; justify-content: flex-end; margin-top: 24px; }
    .result-summary { margin: 0 0 24px; font-size: 1.15rem; }
    .result-item { border-top: 1px solid var(--border); padding: 18px 0; }
    .result-item:first-child { border-top: 0; padding-top: 0; }
    .result-item h3 { margin: 0 0 8px; font: 500 1rem/1.35 "Google Sans", sans-serif; }
    .result-item p { margin: 4px 0; }
    .correct { color: var(--success); font-weight: 500; }
    .incorrect { color: var(--danger); font-weight: 500; }
    .blocked { text-align: center; border-color: #f4b400; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @keyframes appear { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @media (min-width: 600px) { .site-header { padding: 28px 32px; } main { padding-top: 32px; } .card { padding: 32px; } }
  </style>
</head>
<body>
  <header class="site-header"><div class="header-content"><h1>Evaluación de programación</h1></div></header>
  <main>
    <section id="start-screen" class="screen active" aria-labelledby="start-title">
      <div class="card intro-card">
        <h2 id="start-title">Datos del estudiante</h2>
        <p class="hint">Completa tus datos para comenzar la evaluación.</p>
        <form id="registration-form" novalidate>
          <label for="nombre">Nombre completo</label>
          <input id="nombre" name="nombre" autocomplete="name" required maxlength="120">
          <label for="correo">Correo institucional</label>
          <input id="correo" name="correo" type="email" autocomplete="email" required maxlength="160">
          <p id="registration-error" class="error" role="alert"></p>
          <div class="form-actions"><button type="submit">Comenzar examen</button></div>
        </form>
      </div>
    </section>

    <section id="exam-screen" class="screen" aria-labelledby="question-title">
      <div class="exam-toolbar"><span id="progress" class="progress"></span><span id="timer" class="timer" role="timer" aria-live="polite"></span></div>
      <article class="card"><h2 id="question-title"></h2><div id="code-container"></div><form id="answer-form"><div id="options" class="options"></div><div class="exam-actions"><button type="submit">Siguiente</button></div></form></article>
    </section>

    <section id="result-screen" class="screen" aria-labelledby="result-title">
      <div class="card"><h2 id="result-title">Evaluación finalizada</h2><p id="result-summary" class="result-summary"></p><div id="result-details"></div><p id="send-status" class="hint"></p></div>
    </section>

    <section id="blocked-screen" class="screen" aria-labelledby="blocked-title">
      <div class="card blocked"><h2 id="blocked-title">Evaluación bloqueada</h2><p>La evaluación se finalizó porque se detectó un uso no permitido de las herramientas del navegador.</p><p id="blocked-status" class="hint"></p></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
